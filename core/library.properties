name=BomberCatCore
version=0.3.0
author=Electronic Cats
maintainer=Electronic Cats <electroniccats.com>
sentence=Reusable core library for BomberCat NFCGate relay and MagSpoof/tag firmware.
paragraph=Provides NfcController (PN7150 wrapper), ConfigStore (persistent WiFi/relay config), Log and HexUtils helpers, the vendored NFCGate protobuf (NFCData/ServerData) generated with nanopb, MagStripe (shared MagSpoof F2F magnetic-stripe engine, classic and forward-only waveforms) and TagReader (shared PN7150 tag helpers). Shared foundation for the relay, MagSpoof and tag-reader sketches.
category=Communication
url=https://github.com/ElectronicCats/BomberCat
architectures=mbed_rp2040
depends=Electronic Cats PN7150
includes=BomberCatCore.h,BomberCatControl.h,MagStripe.h,TagReader.h
